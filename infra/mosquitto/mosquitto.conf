# Mosquitto config para RTLS Safetrack — PoC dev.
#
# IMPORTANTE: este config es PERMISIVO (anonymous allowed) para
# acelerar el desarrollo. Antes de producción:
#   - listener 8883 con TLS y certificado
#   - password_file y allow_anonymous false
#   - ACLs por topic (publicadores HW vs suscriptores aplicación)

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
