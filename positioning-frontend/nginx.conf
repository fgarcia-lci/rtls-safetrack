server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: cualquier ruta desconocida la atiende index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # XKT son grandes (~100 MB), permite el cache fuerte
    location ~* \.(xkt|gltf|glb)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy hacia el positioning-api (incluye WebSocket /api/ws)
    location /api/ {
        proxy_pass http://positioning-api:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers para STOMP/SockJS
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Timeouts amplios para conexiones WS de larga duración
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # Tamaño del body — por si en el futuro suben cosas grandes
    client_max_body_size 50m;
}
