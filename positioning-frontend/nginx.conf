server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: cualquier ruta desconocida la atiende index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /assets/* contiene bundles JS/CSS con hash en el nombre. Si el
    # usuario tiene una pestaña cacheada que referencia un hash viejo
    # tras un rebuild, NO debemos hacer fallback a index.html (eso
    # devolvería HTML cuando el browser espera JS → MIME error y
    # pantalla en blanco). Mejor 404 — el navegador trata el fallo
    # como "stale" y al recargar pide el index.html nuevo con los
    # hashes correctos.
    location /assets/ {
        try_files $uri =404;
        # Vite genera nombres con hash → cache inmutable 1 año.
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # index.html NUNCA se cachea — debe servir siempre la versión más
    # reciente con los hashes del bundle actual. Sin esto, una pestaña
    # vieja sigue pidiendo bundles que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # XKT/GLTF/GLB son grandes (~100 MB) y se versionan en el nombre
    # de archivo (`solubilizacion_v1.xkt` → `_v2.xkt` cuando cambian).
    # Cache fuerte de 1 año + immutable: el navegador no revalida nunca.
    # Reduce el "load del modelo" en navegaciones repetidas a milisegundos.
    location ~* \.(xkt|gltf|glb)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Proxy hacia el positioning-api (incluye WebSocket /api/ws)
    location /api/ {
        proxy_pass http://positioning-api:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers para STOMP/SockJS
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Timeouts amplios para conexiones WS de larga duración
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # Tamaño del body — por si en el futuro suben cosas grandes
    client_max_body_size 50m;
}
