# =============================================================================
# RTLS Safetrack — configuración del simulador
#
# Coordenadas en el sistema mundial del XKT solubilizacion_v1 (UTM-like).
# Bbox del modelo (de viewer.scene.models.ALL.aabb):
#   X: -2465133.66 .. -2464901.46  (ancho ~232 m)
#   Y_horizontal (Z en xeokit): 32235034.74 .. 32235242.05  (ancho ~207 m)
#   Z (altura, Y en xeokit): 64.22 .. 163.42  (suelo a 64.22)
#
# Convención del simulador (RTLS clásica): waypoints = [X, Y_horizontal]
# (top-down). La altura va en `default_z`. El visor 3D hace el swap Y↔Z al
# pintar para que xeokit (Y-up) lo coloque a la altura correcta.
#
# Cinturón humano: ~1.2 m sobre el suelo → 64.22 + 1.2 ≈ 65.4 m de altura.
# =============================================================================

plant_id: TSP3

broker:
  host: ${MQTT_HOST:-localhost}
  port: ${MQTT_PORT:-1884}
  username: ${MQTT_USERNAME:-}
  password: ${MQTT_PASSWORD:-}
  client_id_prefix: rtls-simulator

publish:
  position_hz: 1
  status_seconds: 30
  heartbeat_seconds: 10

simulation:
  tick_ms: 100
  jitter_m: 0.10
  default_z: 65.5             # altura del cinturón sobre el suelo del modelo
  battery_drop_per_hour_pct: 0.5

