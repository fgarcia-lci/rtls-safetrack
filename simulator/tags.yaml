# =============================================================================
# RTLS Safetrack — configuración del simulador
#
# Coordenadas en el sistema mundial del XKT edificios2x3 (modelo activo).
# Bbox ORIGINAL del modelo (sin calibración aplicada):
#   X: 5823.64 .. 6232.91          (ancho ~409 m)
#   Y_horizontal (Z en xeokit): -3296.80 .. -2604.91   (ancho ~692 m)
#   Z (altura, Y en xeokit): 52.31 .. 89.07
#
# El admin calibra el modelo con un offset Y (default_y_offset = -6.2
# en BD para esta plant_view), bajando todo el modelo. Por tanto el
# SUELO EFECTIVO de la fábrica queda a 52.31 + (-6.2) ≈ 46.11 m.
#
# `default_z` representa la altura a la que está físicamente el tag —
# para el simulador asumimos tags pegados al suelo (z = suelo efectivo)
# para que los avatares se vean al ras del piso. Si el HW real coloca
# los tags en el cinturón a 1.2 m, basta con sumar 1.2 a este valor.
# =============================================================================

plant_id: TSP3

broker:
  host: ${MQTT_HOST:-localhost}
  port: ${MQTT_PORT:-1884}
  username: ${MQTT_USERNAME:-}
  password: ${MQTT_PASSWORD:-}
  client_id_prefix: rtls-simulator

publish:
  position_hz: 1
  status_seconds: 30
  heartbeat_seconds: 10

simulation:
  tick_ms: 100
  jitter_m: 0.10
  default_z: 52.3             # altura del suelo VISIBLE de la fábrica
                              # (ymin del XKT incluye cimientos/subsuelo)
  battery_drop_per_hour_pct: 0.5

tags:
  # Cuadrante NW (X bajo, Z bajo) — rectángulo pequeño
  - id: "AA:BB:CC:DD:00:01"
    name: "Worker_01"
    waypoints:
      - [5870, -3250]
      - [5950, -3250]
      - [5950, -3170]
      - [5870, -3170]
    speed: 1.2
    pause_at_waypoint_seconds: 2
    battery_start: 95

  # Cuadrante NE — rectángulo pequeño
  - id: "AA:BB:CC:DD:00:02"
    name: "Worker_02"
    waypoints:
      - [6080, -3250]
      - [6180, -3250]
      - [6180, -3170]
      - [6080, -3170]
    speed: 1.0
    pause_at_waypoint_seconds: 3
    battery_start: 80

  # Cuadrante SW — rectángulo pequeño
  - id: "AA:BB:CC:DD:00:03"
    name: "Worker_03"
    waypoints:
      - [5870, -2900]
      - [5960, -2900]
      - [5960, -2800]
      - [5870, -2800]
    speed: 1.4
    pause_at_waypoint_seconds: 1
    battery_start: 70

  # Cuadrante SE — rectángulo pequeño
  - id: "AA:BB:CC:DD:00:04"
    name: "Worker_04"
    waypoints:
      - [6080, -2900]
      - [6180, -2900]
      - [6180, -2780]
      - [6080, -2780]
    speed: 1.1
    pause_at_waypoint_seconds: 5
    battery_start: 60

  # Ruta diagonal NW → SE (cruza la planta entera)
  - id: "AA:BB:CC:DD:00:05"
    name: "Worker_05"
    waypoints:
      - [5860, -3260]
      - [6000, -3100]
      - [6080, -2900]
      - [6200, -2680]
    speed: 0.8
    pause_at_waypoint_seconds: 4
    battery_start: 50

  # Línea vertical larga (recorre todo el eje Z)
  - id: "AA:BB:CC:DD:00:06"
    name: "Worker_06"
    waypoints:
      - [6000, -3260]
      - [6000, -2680]
    speed: 0.9
    pause_at_waypoint_seconds: 6
    battery_start: 45

  # Línea horizontal larga (recorre todo el eje X)
  - id: "AA:BB:CC:DD:00:07"
    name: "Worker_07"
    waypoints:
      - [5860, -3000]
      - [6200, -3000]
    speed: 1.3
    pause_at_waypoint_seconds: 2
    battery_start: 88

  # Rectángulo perimetral grande (vuelta a la planta)
  - id: "AA:BB:CC:DD:00:08"
    name: "Worker_08"
    waypoints:
      - [5860, -3260]
      - [6200, -3260]
      - [6200, -2680]
      - [5860, -2680]
    speed: 1.0
    pause_at_waypoint_seconds: 3
    battery_start: 75

  # Línea vertical (zona central-oeste)
  - id: "AA:BB:CC:DD:00:09"
    name: "Worker_09"
    waypoints:
      - [5920, -3200]
      - [5920, -2740]
    speed: 1.5
    pause_at_waypoint_seconds: 1
    battery_start: 30

  # Rectángulo central pequeño
  - id: "AA:BB:CC:DD:00:0A"
    name: "Worker_10"
    waypoints:
      - [5990, -3050]
      - [6090, -3050]
      - [6090, -2950]
      - [5990, -2950]
    speed: 1.1
    pause_at_waypoint_seconds: 2
    battery_start: 100
